<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 791 699" width="791" height="699" role="img" aria-label="Photo coming soon">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2136"/>
      <stop offset="1" stop-color="#16385c"/>
    </linearGradient>
  </defs>

  <rect width="791" height="699" fill="#ffffff"/>

  <!-- dark panel, echoing the framing of the photo it replaces -->
  <rect x="46" y="0" width="700" height="590" rx="8" fill="url(#panel)"/>

  <!-- ULTRAFIT-blue diagonal accent, matching the source layout's lower-left wedge -->
  <path d="M0 699 L0 470 L46 470 L46 590 L300 590 L455 699 Z" fill="#165DA3"/>

  <g fill="none" stroke="#6EC1E4" stroke-width="5" opacity=".85" stroke-linecap="round">
    <circle cx="396" cy="224" r="54"/>
    <path d="M328 340 A68 62 0 0 1 464 340"/>
  </g>

  <text x="396" y="424" text-anchor="middle" fill="#ffffff"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700"
        letter-spacing="4">COMING SOON</text>

  <text x="396" y="474" text-anchor="middle" fill="#8fb4dd"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" letter-spacing="1">Photo on the way</text>
</svg>
